[package]
name = "mem0-recall"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "mem0_recall"
path = "src/lib.rs"

[[bin]]
name = "mem0-recall"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
